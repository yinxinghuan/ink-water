<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#332e2e">
    <meta name="game-uuid" content="52e57bdb-cf90-4e57-b01b-6258f6d0b884">
    <meta name="description" content="Touch water with color and watch the ink find its own current.">
    <title>Ink & Water</title>
    <script src="https://images.aiwaves.tech/alteru/guest-shell.js" defer></script>
  </head>
  <body>
    <main class="iw-app" data-state="idle">
      <canvas id="canvas" aria-label="Interactive ink and water field"></canvas>

      <section class="iw-cover">
        <div class="iw-cover__wash" aria-hidden="true"><i></i><i></i><i></i></div>
        <header class="iw-title">
          <span>ALTERU / FLUID STUDY 11</span>
          <h1>INK<br>&amp; WATER</h1>
        </header>
        <button class="iw-start" type="button" data-start aria-label="Start Ink and Water">
          <i></i>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.92-1.38z"/>
          </svg>
        </button>
      </section>

      <header class="iw-hud">
        <div><span>INK / WATER</span><small data-water-label></small></div>
        <strong data-progress>00</strong>
      </header>

      <p class="iw-hidden-hint" data-hidden-hint></p>

      <div class="iw-ghost" data-ghost aria-hidden="true">
        <i></i>
        <svg viewBox="0 0 24 24">
          <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.92-1.38z"/>
        </svg>
      </div>

      <section class="iw-result" hidden aria-live="polite">
        <span data-result-kicker></span>
        <strong data-result-title></strong>
        <button type="button" data-restart></button>
      </section>

      <section class="iw-error" hidden role="alert">
        <strong data-error-title></strong>
        <p data-error-copy></p>
        <button type="button" data-retry></button>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
